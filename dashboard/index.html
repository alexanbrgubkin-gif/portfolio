<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Shell — demo (Bootstrap 5)</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<style>
  :root { --shell-sidebar-w: 260px; --shell-topbar-h: 56px; }
  .shell-topbar { height: var(--shell-topbar-h); }
  .shell-sidebar { width: var(--shell-sidebar-w); }
  @media (min-width: 992px) {
    .shell-sidebar { position: sticky; top: var(--shell-topbar-h); height: calc(100vh - var(--shell-topbar-h)); overflow-y: auto; }
  }
  .shell-nav .nav-link { border-radius: .5rem; color: var(--bs-body-color); display: flex; gap: .6rem; align-items: center; }
  .shell-nav .nav-link:hover { background: var(--bs-tertiary-bg); }
  .shell-nav .nav-link.active { background: var(--bs-primary-bg-subtle); color: var(--bs-primary-text-emphasis); font-weight: 600; }
  .shell-nav .nav-link:focus-visible { outline: 2px solid var(--bs-primary); outline-offset: 2px; }
  .shell-nav .nav-sub .nav-link { padding-left: 2.4rem; font-size: .925rem; }
  main:focus { outline: none; }
</style>
</head>
<body class="bg-body-tertiary">
<a class="visually-hidden-focusable position-absolute top-0 start-0 m-2 btn btn-primary" href="#main">К содержимому</a>

<!-- Topbar -->
<header class="shell-topbar navbar bg-body border-bottom sticky-top px-3">
  <div class="d-flex align-items-center gap-2">
    <button class="btn btn-outline-secondary d-lg-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#shellOffcanvas" aria-controls="shellOffcanvas" aria-label="Открыть меню">
      <i class="bi bi-list"></i>
    </button>
    <span class="navbar-brand mb-0 h1 fs-5">Workspace</span>
  </div>
  <div class="d-flex align-items-center gap-2">
    <div class="dropdown">
      <button class="btn btn-light border dropdown-toggle" id="ctxBtn" data-bs-toggle="dropdown" aria-expanded="false">
        <i class="bi bi-briefcase"></i> <span id="ctxLabel"></span>
      </button>
      <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="ctxBtn" id="ctxMenu"></ul>
    </div>
  </div>
</header>

<div class="d-flex">
  <!-- Один и тот же sidebar: на lg+ — колонка, ниже — Bootstrap Offcanvas -->
  <aside class="shell-sidebar offcanvas-lg offcanvas-start bg-body border-end" tabindex="-1" id="shellOffcanvas" aria-labelledby="shellOffcanvasLabel">
    <div class="offcanvas-header d-lg-none">
      <h2 class="offcanvas-title fs-5" id="shellOffcanvasLabel">Меню</h2>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#shellOffcanvas" aria-label="Закрыть"></button>
    </div>
    <div class="offcanvas-body p-3">
      <nav aria-label="Основная навигация" class="w-100"><ul class="nav flex-column shell-nav gap-1" id="shellNav"></ul></nav>
    </div>
  </aside>

  <div class="flex-grow-1 min-w-0">
    <div class="container-fluid py-3 px-3 px-md-4">
      <nav aria-label="Хлебные крошки"><ol class="breadcrumb mb-3" id="crumbs"></ol></nav>
      <main id="main" tabindex="-1"></main>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
/* ===== Route registry: единый источник для меню, крошек и заголовков ===== */
const ROUTES = [
  { path: '/dashboard',                       title: 'Главная',            icon: 'house',    parent: null },
  { path: '/dashboard/overview',              title: 'Обзор',              icon: 'graph-up', parent: '/dashboard' },
  { path: '/dashboard/profile',               title: 'Профиль',            icon: 'person',   parent: '/dashboard' },
  { path: '/dashboard/profile/professional',  title: 'Проф. профиль',      icon: 'award',    parent: '/dashboard/profile' },
  { path: '/dashboard/work-contexts',         title: 'Рабочие контексты',  icon: 'briefcase',parent: '/dashboard' },
  { path: '/dashboard/settings',              title: 'Настройки',          icon: 'gear',     parent: '/dashboard' },
];
const byPath = Object.fromEntries(ROUTES.map(r => [r.path, r]));
const CONTEXTS = [{ id: 'clinic-a', name: 'Клиника «Альфа»' }, { id: 'clinic-b', name: 'Клиника «Бета»' }];
const state = { ctx: CONTEXTS[0].id };

const currentPath = () => (location.hash.slice(1) || '/dashboard');
const chain = p => { const out = []; for (let r = byPath[p]; r; r = byPath[r.parent]) out.unshift(r); return out; };

/* ===== Меню: рендер один раз, active/aria-current — на каждом переходе ===== */
function renderNav() {
  const top = ROUTES.filter(r => r.parent === '/dashboard' || r.parent === null);
  document.getElementById('shellNav').innerHTML = top.map(r => {
    const kids = ROUTES.filter(c => c.parent === r.path && r.parent !== null);
    return `<li class="nav-item">
      <a class="nav-link" href="#${r.path}" data-path="${r.path}"><i class="bi bi-${r.icon}" aria-hidden="true"></i>${r.title}</a>
      ${kids.length ? `<ul class="nav flex-column nav-sub">${kids.map(k =>
        `<li class="nav-item"><a class="nav-link" href="#${k.path}" data-path="${k.path}">${k.title}</a></li>`).join('')}</ul>` : ''}
    </li>`;
  }).join('');
}
function markActive(p) {
  document.querySelectorAll('#shellNav .nav-link').forEach(a => {
    const on = a.dataset.path === p;
    a.classList.toggle('active', on);
    on ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current');
  });
}

/* ===== Контекст: переключатель в topbar, без отдельных дашбордов по ролям ===== */
function renderCtx() {
  document.getElementById('ctxLabel').textContent = CONTEXTS.find(c => c.id === state.ctx).name;
  document.getElementById('ctxMenu').innerHTML = CONTEXTS.map(c =>
    `<li><button class="dropdown-item${c.id === state.ctx ? ' active' : ''}" data-ctx="${c.id}" ${c.id === state.ctx ? 'aria-current="true"' : ''}>${c.name}</button></li>`).join('');
}
document.getElementById('ctxMenu').addEventListener('click', e => {
  const b = e.target.closest('[data-ctx]'); if (!b) return;
  state.ctx = b.dataset.ctx; renderCtx(); render();
});

/* ===== Страницы (demo-состояние, без backend) ===== */
const card = (t, b) => `<div class="card shadow-sm"><div class="card-body"><h2 class="h6 text-body-secondary">${t}</h2>${b}</div></div>`;
const PAGES = {
  '/dashboard': () => `<div class="row g-3">${['Записи сегодня','Новые заявки','Выручка, ₽'].map((t,i)=>`<div class="col-12 col-md-4">${card(t,`<div class="fs-3 fw-bold">${[12,5,'84 300'][i]}</div>`)}</div>`).join('')}</div>`,
  '/dashboard/overview': () => card('Активность за неделю', `<div class="table-responsive"><table class="table table-sm mb-0"><thead><tr><th>День</th><th>Записи</th><th>Отмены</th></tr></thead><tbody>${['Пн','Вт','Ср','Чт','Пт'].map((d,i)=>`<tr><td>${d}</td><td>${10+i}</td><td>${i%2}</td></tr>`).join('')}</tbody></table></div>`),
  '/dashboard/profile': () => card('Профиль', `<form class="row g-3" onsubmit="event.preventDefault()"><div class="col-md-6"><label class="form-label" for="fn">Имя</label><input class="form-control" id="fn" value="Анна"></div><div class="col-md-6"><label class="form-label" for="em">E-mail</label><input class="form-control" id="em" type="email" value="anna@example.com"></div><div class="col-12"><button class="btn btn-primary">Сохранить</button></div></form>`),
  '/dashboard/profile/professional': () => card('Профессиональный профиль', `<p class="mb-0">Специализация, стаж, сертификаты — demo.</p>`),
  '/dashboard/work-contexts': () => card('Рабочие контексты', `<ul class="list-group">${CONTEXTS.map(c=>`<li class="list-group-item d-flex justify-content-between">${c.name}${c.id===state.ctx?'<span class="badge text-bg-primary">текущий</span>':''}</li>`).join('')}</ul>`),
  '/dashboard/settings': () => card('Настройки', `<div class="form-check form-switch"><input class="form-check-input" type="checkbox" id="n1" checked><label class="form-check-label" for="n1">Уведомления</label></div>`),
};

/* ===== Рендер маршрута: крошки, заголовок, фокус ===== */
function render() {
  let p = currentPath(); if (!byPath[p]) { p = '/dashboard'; history.replaceState(null, '', '#' + p); }
  const c = chain(p);
  document.getElementById('crumbs').innerHTML = c.map((r, i) => i === c.length - 1
    ? `<li class="breadcrumb-item active" aria-current="page">${r.title}</li>`
    : `<li class="breadcrumb-item"><a href="#${r.path}">${r.title}</a></li>`).join('');
  const main = document.getElementById('main');
  main.innerHTML = `<h1 class="h4 mb-3">${byPath[p].title}</h1>` + PAGES[p]();
  document.title = `${byPath[p].title} — Workspace`;
  markActive(p);
  return main;
}
// Три сценария закрытия offcanvas:
//  1) обычное (кнопка «Закрыть», Esc, клик по фону) — фокус возвращает сам Bootstrap на кнопку меню;
//  2) закрытие при навигации — фокус на контент, но только после анимации (иначе Bootstrap перебьёт его);
//  3) переход к desktop с открытой панелью — Bootstrap закрывает её на resize, кнопка меню скрыта (d-lg-none),
//     поэтому, если фокус остался на невидимом элементе, переводим его на контент.
const ocEl = document.getElementById('shellOffcanvas');
const mainEl = document.getElementById('main');
let closingByNav = false;
const isVisible = el => !!el && el !== document.body && el.getClientRects().length > 0 && getComputedStyle(el).visibility !== 'hidden';
ocEl.addEventListener('hidden.bs.offcanvas', () => {
  const byNav = closingByNav; closingByNav = false;
  // setTimeout: обработчик Bootstrap (возврат фокуса на кнопку меню) срабатывает на том же событии позже нашего,
  // поэтому решаем после него: при навигации — всегда на контент, иначе — только если фокус на невидимом элементе
  setTimeout(() => { if (byNav || !isVisible(document.activeElement)) mainEl.focus(); }, 0);
});
window.addEventListener('hashchange', () => {
  render();
  const oc = bootstrap.Offcanvas.getInstance(ocEl);
  if (oc && ocEl.classList.contains('show')) { closingByNav = true; oc.hide(); }
  else mainEl.focus();
});
renderNav(); renderCtx(); render();
</script>
<div style="position:fixed;bottom:0;left:0;right:0;z-index:9999;background:#111;color:#fff;font:13px/1.4 Arial,sans-serif;text-align:center;padding:6px">Демо-сайт для портфолио — компания вымышленная. Разработка: Александр Выскребенцев</div></body>
</html>
